name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ContadorSalario-2.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle -p ContadorSalario :app:assembleDebug
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-atual --yes --cleanup-tag || true
          gh release create apk-atual ContadorSalario/app/build/outputs/apk/debug/app-debug.apk --title "APK atual" --notes "Build ${{ github.run_number }}"
