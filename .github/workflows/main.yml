name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ContadorSalario-1.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle -p ContadorSalario :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: contador-apk
          path: ContadorSalario/app/build/outputs/apk/debug/app-debug.apk
