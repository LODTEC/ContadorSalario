name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extrair zip mais novo
        run: |
          ZIP=$(ls ContadorSalario-[0-9]*.zip | sort -V | tail -1)
          echo "Usando $ZIP"
          unzip -q "$ZIP"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        run: gradle -p ContadorSalario :app:assembleRelease
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ContadorSalario/app/build/outputs/apk/release/app-release.apk ContadorSalario.apk
          gh release delete apk-atual --yes --cleanup-tag || true
          gh release create apk-atual ContadorSalario.apk --title "APK atual" --notes "Build automático"
